server {
    listen 80;
    server_name _;

    # Piège #1 (PLAN.md §10) : /about.json doit avoir sa propre location, EXACTE,
    # déclarée avant la location générale /, sinon try_files le fait passer pour
    # une route du SPA et renvoie index.html au lieu du JSON.
    location = /about.json {
        proxy_pass http://api:3000/about.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
