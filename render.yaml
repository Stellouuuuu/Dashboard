services:
  - type: web
    name: threshold-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: threshold-db
          property: connectionString
      # Any string works for JWT signing, so Render can generate it safely.
      - key: JWT_SECRET
        generateValue: true
      # Must decode to exactly 32 bytes (64 hex chars) - Render's generateValue
      # isn't guaranteed to produce valid hex, so set this manually in the
      # dashboard. Generate one with: openssl rand -hex 32
      - key: CRYPTO_KEY
        sync: false
      # Set once the threshold-frontend service below has a URL, e.g.
      # https://threshold-frontend.onrender.com
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Render's free plan blocks outbound SMTP (25/465/587), so SMTP_HOST/USER/PASS
      # above won't work here. Set this to send through Brevo's HTTP API instead
      # (sender verification, no domain needed) - the email in SMTP_FROM must
      # match the verified sender.
      - key: BREVO_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  - type: web
    name: threshold-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    envVars:
      # Render assigns the actual URL at creation time (often with a random
      # suffix, e.g. threshold-api-pmzv.onrender.com, if the plain name is
      # taken) - sync: false so a Blueprint re-sync never overwrites the real
      # value set manually in the dashboard with a wrong guess.
      - key: API_ORIGIN
        sync: false

databases:
  - name: threshold-db
    plan: free
    databaseName: dashboard
    user: dashboard
